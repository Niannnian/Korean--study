<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韩语书房 V1.2</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#243c36;font:17px system-ui}header,main{max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:38px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:12px;border:1px solid #b7c9bf;border-radius:12px;background:white;color:#243c36;cursor:pointer}button:hover{background:#e3eee7}.hero{background:#254e42;color:white;padding:32px;border-radius:24px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:white;border:1px solid #e2e4d9;padding:24px;border-radius:18px;margin:12px 0}.ko{font-size:36px;margin:24px 0}progress{width:100%;accent-color:#3d8064}small{color:#657b70}.hidden{display:none}footer{padding:30px;text-align:center}button:focus-visible{outline:3px solid #db8d40}body{background:radial-gradient(ellipse at top right,#e7ecdf,transparent 55%),#f7f4ed}header{border-bottom:1px solid #d9e0d5}header b{font-size:23px}.hero{position:relative;overflow:hidden;padding:48px;background:linear-gradient(120deg,#183f36,#4d7860);box-shadow:0 18px 50px #284b3918}.hero:after{content:'한';position:absolute;right:28px;top:-34px;font-size:220px;opacity:.08;pointer-events:none}h1{font-family:Georgia,serif;max-width:650px;line-height:1.35}nav{position:sticky;top:0;padding:14px 0;background:#f7f4edf5;z-index:2}nav button[aria-pressed=true]{background:#254e42;color:white;border-color:#254e42}.card{box-shadow:0 6px 24px #243c3606}.card button{margin:4px}.ko{letter-spacing:2px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{font-size:32px;color:#254e42}.bar{height:9px;background:#e5ecdf;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#759579}.lesson-title{cursor:pointer}#view>h2{margin-top:30px}@media(max-width:600px){header,main{padding:18px}header small{font-size:11px}.hero{padding:26px}h1{font-size:29px}.tiles{grid-template-columns:1fr}.card{padding:18px}nav{gap:5px}nav button{font-size:14px;padding:10px}.ko{font-size:30px}}@media(prefers-reduced-motion:no-preference){button{transition:background .18s,transform .18s}button:hover{transform:translateY(-1px)}}</style><header><b>서재 · 韩语书房</b><small>V1.2 · 每天进步一点</small></header><main><div class="hero"><small style="color:#d4e4db">안녕하세요!</small><h1>从第一声问候，开始学韩语。</h1><p>课程 · 单词卡 · 发音 · 随堂练习</p><div id="stats"></div></div><nav id="nav"></nav><section id="view"></section><p id="status" role="status"></p></main><footer>学习记录保存在当前浏览器 · 朗读需要设备提供韩语语音</footer><script>
const words=[['안녕하세요','你好','annyeonghaseyo'],['감사합니다','谢谢','gamsahamnida'],['네','是','ne'],['아니요','不是','aniyo'],['안녕히 가세요','再见（对离开的人）','annyeonghi gaseyo'],['미안합니다','对不起','mianhamnida'],['물','水','mul'],['밥','饭','bap'],['커피','咖啡','keopi'],['사과','苹果','sagwa'],['학교','学校','hakgyo'],['친구','朋友','chingu'],['책','书','chaek'],['집','家','jip'],['사랑','爱','sarang'],['오늘','今天','oneul'],['내일','明天','naeil'],['한국어','韩语','hangugeo'],['하나','一','hana'],['둘','二','dul'],['셋','三','set'],['넷','四','net'],['다섯','五','daseot'],['좋아요','很好／喜欢','joayo']];
const lessons=[['01 · 韩文字母','韩文按音节组合书写，例如 한 = ㅎ + ㅏ + ㄴ。先听元音，再练辅音。',[['아','ㅏ：a'],['어','ㅓ：eo'],['오','ㅗ：o'],['우','ㅜ：u'],['으','ㅡ：eu'],['이','ㅣ：i'],['가','ㄱ + ㅏ'],['나','ㄴ + ㅏ'],['다','ㄷ + ㅏ']]],['02 · 初次见面','礼貌问候通常使用 -요 或 -습니다 结尾。',[['안녕하세요','你好'],['저는 학생입니다','我是学生'],['만나서 반갑습니다','很高兴见到你']]],['03 · 咖啡店','주세요 表示“请给我”，可以接在想要的东西之后。',[['커피 주세요','请给我咖啡'],['물 주세요','请给我水'],['얼마예요?','多少钱？']]],['04 · 日常对话','用 어디 表示“哪里”，用 뭐 表示“什么”。',[['어디에 가요?','你去哪里？'],['학교에 가요','我去学校'],['뭐 해요?','你在做什么？']]],['05 · 数字与数量','固有数词可用于计数；搭配量词时 하나、둘、셋、넷 常变为 한、두、세、네。',[['하나 둘 셋 넷 다섯','一 二 三 四 五'],['한 개 주세요','请给我一个'],['두 잔 주세요','请给我两杯']]],['06 · 自我介绍','은/는 提示话题，이에요/예요 表示“是”。有收音用 이에요，没有收音用 예요。',[['저는 중국 사람이에요','我是中国人'],['저는 한국어를 공부해요','我学习韩语'],['이름이 뭐예요?','你叫什么名字？']]]];
let state={done:[],known:[],wrong:[],days:[],attempts:0,correct:0};try{state=Object.assign(state,JSON.parse(localStorage.getItem('korean-study-v11')||'{}'))}catch{}let pos=0,flipped=false,tab='学习首页',answer=null,score=0,total=0;
function save(){try{localStorage.setItem('korean-study-v11',JSON.stringify(state))}catch{document.getElementById('status').textContent='浏览器禁止保存，当前进度仅在本次使用期间保留。'}stats()}
function stats(){document.getElementById('stats').textContent='课程 '+state.done.length+'/'+lessons.length+' · 已掌握单词 '+state.known.length+'/'+words.length}
function speak(text){if(!('speechSynthesis'in window)){document.getElementById('status').textContent='此浏览器不支持朗读，请使用 Edge 或 Chrome。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=.8;let voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));if(voice)u.voice=voice;u.onerror=()=>document.getElementById('status').textContent='朗读不可用，请在系统语音设置中安装韩语语音。';speechSynthesis.speak(u)}
function btn(label,fn,parent){let b=document.createElement('button');b.textContent=label;b.onclick=fn;parent.append(b);return b}
function render(){stats();let v=document.getElementById('view');v.replaceChildren();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.textContent===tab)));
if(tab==='课程'){lessons.forEach((l,i)=>{let c=document.createElement('article');c.className='card';let h=document.createElement('h2');h.textContent=l[0];c.append(h);let p=document.createElement('p');p.textContent=l[1];c.append(p);l[2].forEach(x=>{let p=document.createElement('p');p.textContent=x[0]+' · '+x[1]+' ';btn('▶ 听发音',()=>speak(x[0]),p);c.append(p)});btn(state.done.includes(i)?'✓ 已完成':'标记完成',()=>{state.done=state.done.includes(i)?state.done.filter(n=>n!==i):[...state.done,i];save();render()},c);v.append(c)})}
if(tab==='单词卡'){let c=document.createElement('div');c.className='card';c.innerHTML='<small>点击翻面查看释义 · '+(pos+1)+' / '+words.length+'</small><div class="ko"></div>';c.querySelector('.ko').textContent=flipped?words[pos][1]:words[pos][0];btn('翻面',()=>{flipped=!flipped;render()},c);btn('▶ 发音',()=>speak(words[pos][0]),c);btn('上一张',()=>{pos=(pos+words.length-1)%words.length;flipped=false;render()},c);btn('下一张',()=>{pos=(pos+1)%words.length;flipped=false;render()},c);btn(state.known.includes(pos)?'✓ 已掌握':'记住了',()=>{state.known=state.known.includes(pos)?state.known.filter(n=>n!==pos):[...state.known,pos];save();render()},c);v.append(c)}
if(tab==='词汇表'){let input=document.createElement('input');input.placeholder='搜索韩语或中文';input.setAttribute('aria-label','搜索词汇');let list=document.createElement('div');function show(){list.replaceChildren();words.filter(w=>w.join(' ').includes(input.value.trim())).forEach(w=>{let c=document.createElement('div');c.className='card';c.textContent=w[0]+' · '+w[1]+' · '+w[2]+' ';btn('▶',()=>speak(w[0]),c).setAttribute('aria-label','朗读'+w[0]);list.append(c)})}input.oninput=show;v.append(input,list);show()}
if(tab==='测验'){answer=Math.floor(Math.random()*words.length);let c=document.createElement('div');c.className='card';c.innerHTML='<h2>选择正确的中文意思</h2><p>本次答对 '+score+' / '+total+'</p><div class="ko">'+words[answer][0]+'</div>';btn('▶ 听题',()=>speak(words[answer][0]),c);let opts=[answer];while(opts.length<4){let n=Math.floor(Math.random()*words.length);if(!opts.includes(n))opts.push(n)}opts.sort(()=>Math.random()-.5);let locked=false;opts.forEach(n=>btn(words[n][1],()=>{if(locked)return;locked=true;total++;if(n===answer){score++;state.correct++;state.wrong=state.wrong.filter(x=>x!==answer)}else if(!state.wrong.includes(answer))state.wrong.push(answer);state.attempts++;save();let p=document.createElement('p');p.setAttribute('role','status');p.textContent=n===answer?'回答正确！':'正确答案：'+words[answer][1];c.append(p);btn('下一题',render,c)},c));v.append(c)}
}

words.push(...[['아침','早晨'],['저녁','晚上'],['시간','时间'],['지금','现在'],['날씨','天气'],['비','雨'],['눈','雪'],['바다','大海'],['산','山'],['꽃','花'],['나무','树'],['고양이','猫'],['강아지','小狗'],['가족','家人'],['엄마','妈妈'],['아빠','爸爸'],['동생','弟弟／妹妹'],['이름','名字'],['사람','人'],['음식','食物'],['빵','面包'],['우유','牛奶'],['차','茶／车'],['버스','公交车'],['지하철','地铁'],['역','车站'],['병원','医院'],['약국','药店'],['식당','餐厅'],['가게','商店'],['오른쪽','右边'],['왼쪽','左边'],['앞','前面'],['뒤','后面'],['여기','这里'],['거기','那里']].map(w=>[...w,'']));
lessons.push(['07 · 问路与交通','에 表示目的地，에서 可表示动作发生的地点。',[['지하철역이 어디예요?','地铁站在哪里？'],['오른쪽으로 가세요','请向右走'],['버스를 타요','乘公交车']]],['08 · 餐厅点餐','하고 可以连接名词。表达想做某事时，可以使用 -고 싶어요。',[['메뉴 주세요','请给我菜单'],['빵하고 우유 주세요','请给我面包和牛奶'],['밥을 먹고 싶어요','我想吃饭']]],['09 · 天气与计划','形容词可以直接作谓语。-고 싶어요 表示愿望。',[['오늘 날씨가 좋아요','今天天气很好'],['비가 와요','下雨了'],['내일 바다에 가고 싶어요','明天我想去海边']]],['10 · 家人与爱好','을/를 标记宾语。喜欢某人或某事可以用 좋아해요。',[['저는 책을 좋아해요','我喜欢书'],['우리 가족이에요','这是我的家人'],['음악을 들어요','我听音乐']]]); 
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const originalRender=render;
render=function(){originalRender();let v=document.getElementById('view');
if(tab==='学习首页'){v.innerHTML='<h2>今天，也为自己留一点学习时间。</h2><p><small>每日建议：学一课、记五词、做一次测验。</small></p><div class="tiles">'+[['课程进度',state.done.length+' / '+lessons.length],['掌握词汇',state.known.length+' / '+words.length],['累计打卡',state.days.length+' 天']].map(x=>'<div class="card"><small>'+x[0]+'</small><p class="metric">'+x[1]+'</p></div>').join('')+'</div><div class="card"><h2>我的学习计划</h2><div class="bar"><span style="width:'+Math.round(state.done.length/lessons.length*100)+'%"></span></div><p>测验累计正确 '+state.correct+' / '+state.attempts+' · 待复习 '+state.wrong.length+' 词</p></div>';btn(state.days.includes(today())?'✓ 今天已打卡':'完成今日打卡',()=>{if(!state.days.includes(today()))state.days.push(today());save();render()},v);btn('继续学习',()=>{tab='课程';render()},v);btn('开始复习',()=>{tab='错题复习';render()},v)}
if(tab==='错题复习'){let title=document.createElement('h2');title.textContent='错题复习 · '+state.wrong.length+' 词';v.append(title);if(!state.wrong.length){let p=document.createElement('p');p.textContent='还没有待复习的词。去做一次测验，答错的单词会自动保存在这里。';v.append(p)}state.wrong.forEach(i=>{let c=document.createElement('article');c.className='card';let p=document.createElement('p');p.className='ko';p.textContent=words[i][0];c.append(p);btn('查看释义',e=>{e.target.textContent=words[i][1]},c);btn('▶ 发音',()=>speak(words[i][0]),c);btn('已复习，移出错题',()=>{state.wrong=state.wrong.filter(n=>n!==i);save();render()},c);v.append(c)})}
if(tab==='课程'){v.querySelectorAll('article').forEach(c=>{let h=c.querySelector('h2');h.className='lesson-title';let content=document.createElement('div');while(h.nextSibling)content.append(h.nextSibling);let toggle=btn('展开课程',()=>{content.hidden=!content.hidden;toggle.textContent=content.hidden?'展开课程':'收起课程'},c);content.hidden=true;c.append(content)})}
};

['学习首页','课程','单词卡','词汇表','测验','错题复习'].forEach(t=>btn(t,()=>{tab=t;render()},document.getElementById('nav')));render();
</script></html>
